# Release: на push тега v* или ручной запуск — подписанный release APK + GitHub Release.
name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 37
          build-tools-version: '37.0.0'
          auto-accept-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Secrets (Settings → Secrets → Actions):
      #   KEYSTORE_BASE64            — base64 от keystore/101-counter-release.jks
      #   KEYSTORE_PROPERTIES_BASE64 — base64 от keystore.properties
      # Если заданы — APK подписан релизным ключом, иначе fallback на debug-keystore.
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPS_B64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PROPS_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/101-counter-release.jks
            echo "$KEYSTORE_PROPS_B64" | base64 -d > keystore.properties
            echo "✅ Keystore decoded — APK будет подписан релизным ключом"
          else
            echo "⚠️  KEYSTORE_BASE64 / KEYSTORE_PROPERTIES_BASE64 не заданы —"
            echo "   APK будет подписан debug-keystore (старое поведение)."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.java.home=$JAVA_HOME

      - name: Rename APK with version and tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v${TAG}"
          fi
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/101-counter-${TAG}.apk"
          ls -la app/build/outputs/apk/release/

      - name: Verify APK
        run: |
          ls -la app/build/outputs/apk/release/
          if ! ls app/build/outputs/apk/release/101-counter-v*.apk 1> /dev/null 2>&1; then
            echo "::error::101-counter-v*.apk not found in app/build/outputs/apk/release/"
            exit 1
          fi

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/101-counter-v*.apk | head -1)
          echo "Проверяю: $APK"
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::warning::apksigner не найден в ANDROID_HOME/build-tools — пропускаю верификацию"
            exit 0
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "---"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "(Signer #1 certificate DN|Verified using v[12] scheme)" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "101 Counter ${{ github.ref_name }}"
          generate_release_notes: true
          files: app/build/outputs/apk/release/101-counter-v*.apk
          fail_on_unmatched_files: true
          prerelease: ${{ secrets.KEYSTORE_BASE64 == '' }}
